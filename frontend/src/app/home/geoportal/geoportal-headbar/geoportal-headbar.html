
<div class="geoportal-headbar">
    <div>
        Analizy atrybutowe
    </div>
    <div>
        Mierzenie
    </div>
    <div>
        Zapis analizy
    </div>
    <div>
        Wyszukiwarka
    </div>
    <div (click)="baseLayerOut()" class="baselayer" [class.active-baselayer]="isBaseLayerOut">
        @if(isBaseLayerOut){
            <div class="baselayer-container" (click)="$event.stopPropagation()">
                <div>
                    <p>Mapa OpenStreetMap</p>
                    <mat-slide-toggle [checked]="mapLayerService.isVisible('osmLayer')" (change)="mapLayerService.setLayerVisibility('osmLayer', $event.checked)"></mat-slide-toggle>
                </div>
                <div>
                    <p>Ortofotomapa</p>
                    <mat-slide-toggle [checked]="mapLayerService.isVisible('ortoLayer')" (change)="mapLayerService.setLayerVisibility('ortoLayer', $event.checked)"></mat-slide-toggle>
                </div>
                <div>
                    <p>Mapa wspólna</p>
                    <mat-slide-toggle [checked]="mapLayerService.isVisible('commonLayer')" (change)="mapLayerService.setLayerVisibility('commonLayer', $event.checked)"></mat-slide-toggle>
                </div>
            </div>
        }
        Mapa bazowa
    </div>
    <div (click)="infoToggleService.infoClicked()" class="info" [class.active-info]="infoToggleService.isInfoClicked()">
        Info
    </div>
    <div (click)="layersOut()" class="layers" [class.active-layers]="mapLayerService.isLayerClicked()">
        @if(isLayersOut){
            <div class="layers-container" (click)="$event.stopPropagation()">
                <div>
                    <p>Miejscowości</p>
                    <mat-slide-toggle [checked]="mapLayerService.isVisible('vectorLayer')" (change)="mapLayerService.setLayerVisibility('vectorLayer', $event.checked)"></mat-slide-toggle>
                </div>
                <div>
                    <p>Budynki</p>
                    <mat-slide-toggle [checked]="mapLayerService.isVisible('budLayer')" (change)="mapLayerService.setLayerVisibility('budLayer', $event.checked)"></mat-slide-toggle>
                </div>
                <div>
                    <p>Granice miast</p>
                    <mat-slide-toggle [checked]="mapLayerService.isVisible('boundsLayerCities')" (change)="mapLayerService.setLayerVisibility('boundsLayerCities', $event.checked)"></mat-slide-toggle>
                </div>
                <div>
                    <p>Granice gmin</p>
                    <mat-slide-toggle [checked]="mapLayerService.isVisible('boundsLayerGminy')" (change)="mapLayerService.setLayerVisibility('boundsLayerGminy', $event.checked)"></mat-slide-toggle>
                </div>
                <div>
                    <p>Granice powiatów</p>
                    <mat-slide-toggle [checked]="mapLayerService.isVisible('boundsLayerPowiaty')" (change)="mapLayerService.setLayerVisibility('boundsLayerPowiaty', $event.checked)"></mat-slide-toggle>
                </div>
                <div>
                    <p>Granice województw</p>
                    <mat-slide-toggle [checked]="mapLayerService.isVisible('boundsLayerWojewodz')" (change)="mapLayerService.setLayerVisibility('boundsLayerWojewodz', $event.checked)"></mat-slide-toggle>
                </div>
                <div>
                    <p>Granice państwa</p>
                    <mat-slide-toggle [checked]="mapLayerService.isVisible('boundsLayerPanstwo')" (change)="mapLayerService.setLayerVisibility('boundsLayerPanstwo', $event.checked)"></mat-slide-toggle>
                </div>
            </div>
        }
        Warstwy
    </div>
    
</div>
