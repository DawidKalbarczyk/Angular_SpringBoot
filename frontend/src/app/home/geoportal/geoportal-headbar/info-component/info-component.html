<div class="info-area" (click)="setMarkerPosition($event)">
    @if (showMarker()) {
        <div class="marker-point"
        [style.left.px]="markerX()"
        [style.top.px]="markerY()">
            <img src="/images/icons/pin.png" alt="Pin"/>
        </div>
        <div class="marker"
        [style.left.px]="markerX()"
        [style.top.px]="markerY()"
        [class.marker-active-vertical]="turnMarkerUpsideDown()"
        [class.marker-active-horizontal]="turnMarkerHorizontal()"
        [class.marker-active-horizontal-vertical]="turnMarkerHorVer()">
            <div class="marker-close" (click)="showMarker.set(false)">
                <img src="/images/icons/close.png" alt="Close"/>
            </div>
            @for (layer of layerWithId(); track layer; let i = $index) {
                <div class="marker-content">
                    <p class="testClass">Warstwa: {{ getLayerLabel(layer) }}</p>
                    <p>Id w warstwie: {{ layer.split('.')[1] }}</p>
                    <p>{{ getObjectLabel(layer) }}: {{ properties()[i]?.jpt_nazwa_ }}</p>
                </div>
                @if (i < layerWithId().length - 1) {
                    <div class="separator-div"></div>
                }
            }
            
        </div>
    }
</div>
