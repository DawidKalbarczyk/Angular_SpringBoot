<div class="headbar" [class.login-dark]="isDarkMode()"
[class.login-dark-history]="isDarkMode() && url.startsWith('/history')"
[class.headbar-history]="url.startsWith('/history') && (isDarkMode() === false)">
    <div class="img-container" [class.login-dark-photo]="isDarkMode() && (hasPhoto() === false)"
    [class.login-dark-photo-existing]="hasPhoto() === true">
        <img [src]="isLoggedIn() ? userData()?.photoURL : './images/icons/user.png'" alt="User" draggable="false"/>
    </div>
    <div class="button-container">
        @if (isLoggedIn()) {
            <button class="first-button" routerLink="/user">{{'LOGIN.LOGIN-SETTINGS' | translate}}</button>
            <button class="second-button" routerLink="/" (click)="logoutWithGoogle()"> {{'LOGIN.LOGIN-LOGOUT' | translate}}</button>

        } @else {
            <button class="first-button" routerLink="/login" [queryParams]="{type: 'signin'}">{{'LOGIN.LOGIN-REGISTER' | translate}}</button>
            <button class="second-button" routerLink="/login" [queryParams]="{type: 'login'}">{{'LOGIN.LOGIN-LOGIN' | translate}}</button>
        }
        
    </div>
</div>
