<div class="headbar" [class.login-dark]="isDarkMode()">
    <div class="img-container">
        <img src="./images/icons/user.png" alt="User" draggable="false"/>
    </div>
    <div class="button-container">
        @if (isLoggedIn) {
            <button class="first-button" routerLink="user">Settings</button>
            <button class="second-button">Log Out</button>
        } @else {
            <button class="first-button">Sign In</button>
            <button class="second-button">Log In</button>
        }
        
    </div>
</div>
