<div class="container" [class.mode-dark]="isDarkMode() && url !== '/geoportal'">
    @if(url !== '/') {
        <div (click)="goBack()">
            <img class="return-button" src="./images/icons/return.png" alt="Return" draggable="false"/>
        </div>
    }
    @if(url !== '/geoportal') {
        <div (click)="switchColors()">
            @if(isDarkMode()){
                <img class="night-mode-button" src="./images/icons/sun.png" alt="Sun" draggable="false"/>
            } @else {
                <img class="night-mode-button" src="./images/icons/night-mode.png" alt="Night Mode" draggable="false"/>
            }
        </div>
        <div (click)="languageService.toggleLanguage()">
            <img class="language-button" src="./images/icons/language.png" alt="Language" draggable="false"/>
        </div>
        <div>
            <img class="help-button" src="./images/icons/question.png" alt="Help" draggable="false"/>
        </div>
    }
    
</div>
