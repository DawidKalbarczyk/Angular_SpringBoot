name: Deploy Angular App to GitHub Pages
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: 'deploy-angular-app'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare temporary build directory
        run: |
          rm -rf /tmp/angular-build
          mkdir -p /tmp/angular-build
          cp -R frontend /tmp/angular-build/


      - name: Install dependencies
        working-directory: /tmp/angular-build/frontend
        run: npm install

      - name: Create App
        working-directory: /tmp/angular-build/frontend
        run: npm run build -- --base-href ./ --deploy-url ./

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: /tmp/angular-build/frontend/dist/frontend/browser
          force_orphan: true