name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'deploy-angular-app'
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare temporary build directory
        run: |
          rm -rf /tmp/angular-build
          mkdir -p /tmp/angular-build
          cp -R frontend /tmp/angular-build/

      - name: Install dependencies
        working-directory: /tmp/angular-build/frontend
        run: npm ci

      - name: Build Angular app
        working-directory: /tmp/angular-build/frontend
        run: npm run build -- --configuration production --base-href ./ --deploy-url ./

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/angular-build/frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: [self-hosted, linux, docker]
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4