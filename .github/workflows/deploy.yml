name: Deploy Angular App to GitHub Pages
on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: 'deploy-angular-app'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Clear previous Pages deployments
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          deployment_ids=$(gh api "repos/$REPO/deployments?per_page=100" --paginate --jq '.[] | select(.environment=="github-pages") | .id')
          for deployment_id in $deployment_ids; do
            gh api -X POST "repos/$REPO/deployments/$deployment_id/statuses" -f state=inactive -f description="Superseded by a newer GitHub Pages deployment"
          done

      - name: Install dependencies
        run: npm install --prefix frontend

      - name: Create App
        run: npm run build --prefix frontend -- --base-href ./ --deploy-url ./

      # - name: Debug - show dist structure
      #   run: find frontend/dist -type f

      - name: Deploy artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4