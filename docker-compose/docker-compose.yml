x-environment:
 - &env-postgres-db POSTGRES_DB=${POSTGRES_DB}
 - &env-postgres-user POSTGRES_USER=${POSTGRES_USER}
 - &env-postgres-password POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
 - &env-geoserver-password GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD}
 - &env-geoserver-user GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER}
 - &env-firebase-service-account-json-base64 FIREBASE_SERVICE_ACCOUNT_JSON_BASE64=${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64}
 - &env-geoserver-whitelist GEOSERVER_CSRF_WHITELIST=152.70.47.18:8000

services:
  postgres:
    build:
      context: ..
      dockerfile: docker/postgres/Dockerfile
    image: 'angular-springbootapp-postgres'
    container_name: Angular-SpringBootApp-${ENV_NAME}-postgres
    restart: always
    environment:
      - *env-postgres-db
      - *env-postgres-user
      - *env-postgres-password
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - postgres

  geoserver:
    build:
      context: ..
      dockerfile: docker/geoserver/Dockerfile
    image: 'angular-springbootapp-geoserver'
    container_name: Angular-SpringBootApp-${ENV_NAME}-geoserver
    restart: always
    environment:
      - *env-geoserver-password
      - *env-geoserver-user
      - *env-geoserver-whitelist
      - JAVA_OPTS=-Dorg.bouncycastle.native.cpu_variant=java
    ports:
      - "${GEOSERVER_PORT}:8080"
    volumes:
      - geoserver-data:/opt/geoserver/data_dir
    networks:
      default:
        aliases:
          - geoserver

  springboot:
    build:
      context: ..
      dockerfile: docker/springboot/Dockerfile
    image: 'angular-springbootapp-springboot'
    container_name: Angular-SpringBootApp-${ENV_NAME}-springboot
    restart: always
    environment:
      - *env-postgres-db
      - *env-postgres-user
      - *env-postgres-password
      - *env-geoserver-user
      - *env-geoserver-password
      - *env-firebase-service-account-json-base64
    ports:
      - "${SPRINGBOOT_PORT}:10000"
    volumes:
      - user-images:/app/images/user
    networks:
      default:
        aliases:
          - springboot

  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    image: 'angular-springbootapp-nginx'
    container_name: Angular-SpringBootApp-${ENV_NAME}-nginx
    restart: always
    ports:
      - "${NGINX_PORT}:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://nginx:80
    container_name: Angular-SpringBootApp-${ENV_NAME}-cloudflared
    restart: always
    depends_on:
      - nginx

volumes:
  geoserver-data:
  postgres-data:
  user-images:
